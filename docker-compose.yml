# Full stack: Umbraco + the wrapper in PROXY mode.
# The wrapper's member-auth API forwards to Umbraco; only database A (the durable
# audit store) is provisioned here - database B is never registered or migrated
# in Proxy mode.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wrapper
      POSTGRES_USER: wrapper
      POSTGRES_PASSWORD: wrapper
    volumes:
      - wrapper-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrapper"]
      interval: 5s
      timeout: 3s
      retries: 20

  umbraco:
    build:
      context: .
      dockerfile: cms/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__umbracoDbDSN: "Data Source=/app/umbraco/Data/Umbraco.sqlite.db;Cache=Shared;Foreign Keys=True;Pooling=True"
      ConnectionStrings__umbracoDbDSN_ProviderName: "Microsoft.Data.Sqlite"
      Umbraco__CMS__Unattended__InstallUnattended: "true"
      Umbraco__CMS__Unattended__UnattendedUserName: "Administrator"
      Umbraco__CMS__Unattended__UnattendedUserEmail: "admin@wrapper.local"
      Umbraco__CMS__Unattended__UnattendedUserPassword: "One-Two-Three-Four1!"
      Umbraco__CMS__Global__InstallMissingDatabase: "true"
      Umbraco__CMS__Global__Id: "00000000-0000-0000-0000-000000000000"
      # v2 flow: let OpenIddict issue tokens over plain HTTP for the local rig
      # (Global:UseHttps defaults to true -> "server only accepts HTTPS requests").
      # A real deployment keeps this true and terminates TLS in front of Umbraco.
      Umbraco__CMS__Global__UseHttps: "false"
      # The wrapper reaches Umbraco at this host, so it must be a registered
      # back-office (OpenIddict redirect) host.
      Umbraco__CMS__Security__BackOfficeHost: "http://umbraco:8080"
    ports:
      - "8080:8080"
    volumes:
      - umbraco-data:/app/umbraco/Data
    healthcheck:
      # Healthy only once the custom API is routed AND the startup seeder has run.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/wrapper/health | grep -q '\"seeded\":true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  wrapper:
    build:
      context: .
      dockerfile: src/Ustin.Work.LessMess.UmbarcoWrapper.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Umbraco__BaseUrl: "http://umbraco:8080"
      Umbraco__ManagementBaseUrl: "http://umbraco:8080"
      MemberAuth__Mode: "Proxy"
      MemberAuth__UpstreamBaseUrl: "http://umbraco:8080"
      # Database A - durable, exists in every mode.
      ConnectionStrings__WrapperDb: "Host=db;Port=5432;Database=wrapper;Username=wrapper;Password=wrapper"
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy
      umbraco:
        condition: service_healthy

volumes:
  umbraco-data:
  wrapper-db-data:
