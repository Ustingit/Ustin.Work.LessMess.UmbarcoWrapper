# Test / offline mode: the wrapper's member-auth API backed by a local Postgres,
# no Umbraco involved.
#
#   docker compose -f docker-compose.local.yml up --build
#   ->  Swagger UI at http://localhost:8090/swagger   (title "Ustin Provider Wrapper", v1.1.0)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: providerwrapper
      POSTGRES_USER: wrapper
      POSTGRES_PASSWORD: wrapper
    ports:
      - "5432:5432"
    volumes:
      - provider-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrapper -d providerwrapper"]
      interval: 5s
      timeout: 3s
      retries: 20

  provider-wrapper:
    build:
      context: .
      dockerfile: src/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      MemberAuth__Mode: Local
      MemberAuth__ExposeTokensInResponses: "true"
      ConnectionStrings__LocalAuthDb: "Host=db;Port=5432;Database=providerwrapper;Username=wrapper;Password=wrapper"
      Jwt__SigningKey: "dev-only-ustin-provider-wrapper-signing-key-change-me-32b+"
      Wrapper__DataDirectory: /data
    ports:
      - "8090:8080"
    volumes:
      - provider-wrapper-data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  provider-db-data:
  provider-wrapper-data:
