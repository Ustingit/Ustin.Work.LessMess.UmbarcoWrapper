# Local / test mode: the member-auth API backed by Postgres, no Umbraco.
#
#   docker compose -f docker-compose.local.yml up --build
#   ->  Swagger UI at http://localhost:8090/swagger   (title "Ustin Provider Wrapper", v1.1.0)
#
# Two databases on one server:
#   wrapper   = database A (durable: audit log, later devices/licences/T&C) - always
#   localauth = database B (Local-mode identity store)                      - Local only
# Database B is auto-created by EF Migrate() on first boot.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wrapper
      POSTGRES_USER: wrapper
      POSTGRES_PASSWORD: wrapper
    ports:
      - "5432:5432"
    volumes:
      - provider-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrapper"]
      interval: 5s
      timeout: 3s
      retries: 20

  provider-wrapper:
    build:
      context: .
      dockerfile: src/Ustin.Work.LessMess.UmbarcoWrapper.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      MemberAuth__Mode: Local
      MemberAuth__ExposeTokensInResponses: "true"
      ConnectionStrings__WrapperDb: "Host=db;Port=5432;Database=wrapper;Username=wrapper;Password=wrapper"
      ConnectionStrings__LocalAuthDb: "Host=db;Port=5432;Database=localauth;Username=wrapper;Password=wrapper"
      Jwt__SigningKey: "dev-only-ustin-provider-wrapper-signing-key-change-me-32b+"
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  provider-db-data:
